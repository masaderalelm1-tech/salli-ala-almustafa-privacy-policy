<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Privacy Policy - Salli Ala Almustafa</title>

    <style>

        /* =====================================================
           Global
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f5;
            color: #1f2937;

            line-height: 1.6;
        }


        /* =====================================================
           Main Page
           ===================================================== */

        .page {
            width: 100%;
            min-height: 100vh;

            padding: 30px 20px 40px;
        }


        /* =====================================================
           Logo
           ===================================================== */

        .logo-container {
            text-align: center;

            margin-bottom: 18px;
        }

        .logo {
            display: block;

            width: 150px;
            height: 150px;

            max-width: 100%;

            object-fit: contain;

            margin: 0 auto;
        }


        /* =====================================================
           App Title
           ===================================================== */

        .app-title {
            text-align: center;

            margin-bottom: 35px;
        }

        .app-title h1 {
            margin: 0;

            font-size: 34px;
            line-height: 1.4;

            color: #287b60;

            font-weight: 700;
        }

        .app-title .privacy-title {
            margin-top: 8px;

            font-size: 23px;

            color: #4b5563;

            font-weight: 500;
        }

        .app-title .privacy-arabic {
            margin-top: 3px;

            font-size: 17px;

            color: #6b7280;

            direction: rtl;
        }


        /* =====================================================
           Language Card
           ===================================================== */

        .language-card {
            width: min(1100px, 95%);

            margin: 0 auto;

            background: #ffffff;

            border-radius: 22px;

            padding: 45px 50px 50px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);
        }


        /* =====================================================
           Language Title
           ===================================================== */

        .language-title {
            text-align: center;

            margin: 0 0 8px;

            font-size: 30px;

            color: #1f2937;

            font-weight: 700;
        }

        .language-subtitle {
            text-align: center;

            direction: rtl;

            margin: 0 0 30px;

            font-size: 19px;

            color: #4b5563;
        }


        /* =====================================================
           Language Grid
           ===================================================== */

        .languages {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 18px;

            width: 100%;
        }


        /* =====================================================
           Language Buttons
           ===================================================== */

        .language-button {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            min-height: 62px;

            padding: 12px 8px;

            background: #2f8164;

            color: #ffffff;

            text-decoration: none;

            text-align: center;

            font-size: 18px;

            font-weight: 500;

            border-radius: 10px;

            transition:
                background-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .language-button:hover {
            background: #256b53;

            color: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.12);
        }

        .language-button:active {
            transform: translateY(0);
        }

        .language-button:visited {
            color: #ffffff;
        }


        /* =====================================================
           Footer
           ===================================================== */

        footer {
            width: min(1100px, 95%);

            margin: 35px auto 0;

            text-align: center;

            color: #4b5563;
        }

        footer p {
            margin: 8px 0;

            font-size: 16px;
        }

        footer a {
            color: #2f8164;

            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           Tablet
           ===================================================== */

        @media (max-width: 1000px) {

            .language-card {
                padding: 40px 30px;
            }

            .languages {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));

                gap: 15px;
            }

            .language-button {
                font-size: 17px;
            }
        }


        /* =====================================================
           Mobile
           ===================================================== */

        @media (max-width: 600px) {

            .page {
                padding: 20px 12px 30px;
            }


            /* Smaller logo on mobile */

            .logo {
                width: 110px;
                height: 110px;
            }


            .logo-container {
                margin-bottom: 15px;
            }


            /* App title */

            .app-title {
                margin-bottom: 28px;
            }

            .app-title h1 {
                font-size: 27px;
            }

            .app-title .privacy-title {
                font-size: 20px;
            }

            .app-title .privacy-arabic {
                font-size: 16px;
            }


            /* Language card */

            .language-card {
                width: 100%;

                padding: 30px 18px 35px;

                border-radius: 18px;
            }


            .language-title {
                font-size: 25px;

                margin-bottom: 5px;
            }

            .language-subtitle {
                font-size: 18px;

                margin-bottom: 25px;
            }


            /* Two columns on mobile */

            .languages {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 12px;
            }


            .language-button {
                min-height: 56px;

                padding: 10px 5px;

                font-size: 16px;

                border-radius: 9px;
            }


            footer {
                width: 100%;

                margin-top: 28px;
            }

            footer p {
                font-size: 14px;
            }
        }


        /* =====================================================
           Very Small Phones
           ===================================================== */

        @media (max-width: 380px) {

            .languages {
                grid-template-columns: 1fr;
            }

            .language-button {
                min-height: 52px;

                font-size: 16px;
            }
        }

    </style>
</head>


<body>

            </div>

        </div>


        <!-- =================================================
             Footer
             ================================================= -->

        <footer>

            <p>
                Developed by Masader Al-Elm Educational
            </p>

            <p>
                <a

                >
                    contact@masadereducation.com

            </p>

        </footer>


    </div>

</body>

</html>
